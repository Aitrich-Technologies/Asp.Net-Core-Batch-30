<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hire Me Now</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    .container {
      display: flex;
      width: 1300px;
      height: 600px;
      border: 1px solid black;
      border-bottom: 6px solid black;
    }

    /* Sidebar */
    .sidebar {
      width: 250px;
      background-color: blue;
      color: white;
      padding: 20px;
    }

    .sidebar h2 {
      margin-bottom: 30px;
      text-align: center;
    }

    .sidebar p {
      margin: 15px 0;
      cursor: pointer;
    }

    .sidebar img {
      vertical-align: middle;
    }

    .sidebar .addnew {
      text-align: center;
      margin-top: 50px;
    }

    /* Main content */
    .main {
      flex: 1;
      background: #f0f0f0;
      padding: 20px;
      position: relative;
      display: flex;
      gap: 40px;
    }

    /* Top-right icons */
    .top-icons {
      position: absolute;
      top: 10px;
      right: 20px;
      display: flex;
      gap: 20px;
      align-items: center;
    }

    .top-icons img {
      height: 40px;
      cursor: pointer;
    }

    /* Jobs list */
    #jobsContainer {
      display: flex;
      flex-direction: column;
      gap: 20px;
      margin-top: 50px;
    }

    .job-card {
      width: 400px;
      border: 1px solid black;
      padding: 15px;
      background-color: white;
      border-radius: 8px;
    }

    .job-card h3 {
      margin-bottom: 10px;
    }

    /* Right image */
    .right-image {
      margin-top: 40px;
      
    }

    .right-image img {
      width: 360px;
      height: 530px;
      object-fit: cover;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Sidebar -->
    <div class="sidebar">
      <h2>Hire Me Now!</h2>
      <p><img src="images/dashboard 1.png" height="20"> &nbsp; Dash Board</p>
      <p><img src="images/suitcase 2.png" height="20"> &nbsp; Jobs</p>
      <p><img src="images/application (1) 1.png" height="20"> &nbsp; Applications</p>
      <p><img src="images/question (1) 1.png" height="20"> &nbsp; Interviews</p>
      <p><img src="images/question (1) 1.png" height="20"> &nbsp; Messages</p>
      <p><img src="images/settings 1.png" height="20"> &nbsp; Settings</p>

      <div class="addnew">
        <img src="images/add-group (1) 1.png" height="60"><br>
        Add New
      </div>
    </div>

    <!-- Main content -->
    <div class="main">
      <!-- Top icons -->
      <div class="top-icons">
        <img src="images/notification (1).png" alt="Notification">
        <img src="images/girl.png" alt="Profile">
        <img src="images/exit 1.png" alt="Logout">
      </div>

      <!-- Jobs container -->
      <div id="jobsContainer"></div>

      <!-- Right-side image -->
      <div class="right-image">
        <img src="images/adult-serious-businessman-looking-camera 1.png" alt="Businessman" >
      </div>
    </div>
  </div>

  <script>
    var jobsList = [
      {jobTitle:"Social Media Assistant", Location:"online", date:"16.06.23", Time:"10.00 Am"}, 
      {jobTitle:"Brand Designer", Location:"offline", date:"19.06.23", Time:"12.00 Pm"}, 
      {jobTitle:"Customer Manager", Location:"online", date:"20.06.23", Time:"12.00 pm"}
    ];

    function loadData() {
      var container = document.getElementById("jobsContainer");
      container.innerHTML = ""; // clear before loading

      jobsList.forEach(function(job) {
        container.innerHTML += `
          <div class="job-card">
            <h3>${job.jobTitle}</h3>
            <p><b>Location:</b> ${job.Location}</p>
            <p><b>Date:</b> ${job.date}</p>
            <p><b>Time:</b> ${job.Time}</p>
          </div>
        `;
      });
    }

    // Load jobs when page is ready
    window.onload = loadData;
  </script>
</body>
</html>
