<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    .error {
      color: red;
      font-size: 14px;
      margin-left: 10px;
    }
    
    #movingImage {
      position: relative;
      left: 0;
      transition: left 0.1s;
    }
  </style>
</head>

<body bgcolor="#f1f1f1" link="white" alink="black" vlink="white">
  <table width="100%" border="0">
    <tr>
      <td align="right">
        
        <img id="movingImage" src="images/picture.png" width="400px" height="500px">
      </td>

      <td align="center" rowspan="2">
        <table cellspacing="10px" width="90%" cellpadding="10px">
          <tr>
            <td colspan="3" align="center">
              <font size="5px" color="black"><b>Sign In To dashboard</b></font>
            </td>
          </tr>

          <tr>
            <td colspan="3">
              <label>Email :</label><br>
              <input type="text" size="50" id="email">
              <span id="emailError" class="error"></span>
            </td>
          </tr>

          <tr>
            <td colspan="3">
              <label>Password :</label><br>
              <input type="password" size="50" id="password">
              <span id="passwordError" class="error"></span>
            </td>
          </tr>

          <tr>
            <td colspan="3" align="center">
              <input type="button" value="sign in" onclick="validateForm()">
              <br><br>
              
              <input type="button" value="Move Image" onclick="moveImage()">
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>

  <script>
    function validateForm() {
      let email = document.getElementById("email").value.trim();
      let password = document.getElementById("password").value.trim();

      let emailError = document.getElementById("emailError");
      let passwordError = document.getElementById("passwordError");

      emailError.textContent = "";
      passwordError.textContent = "";

      let correctEmail = "test@example.com";
      let correctPassword = "12345";

      if (email !== correctEmail) {
        emailError.textContent = "Not valid";
      }
      if (password !== correctPassword) {
        passwordError.textContent = "Not valid";
      }

      if (email === correctEmail && password === correctPassword) {
        alert("Login successful!");
      }
    }

    
    function moveImage() {
      let img = document.getElementById("movingImage");
      let pos = 0;
      let interval = setInterval(frame, 10);

      function frame() {
        if (pos >= 100) { 
          clearInterval(interval);
        } else {
          pos++;
          img.style.left = pos + "px";
        }
      }
    }
  </script>
</body>
</html>
