<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Activity</title>
</head>

<body>
    <h2>Sum Difference and Product</h2>
    <script>
        let x = 20;
        let y = 10;

        let sum = x + y;
        let difference = x - y;
        let product = x * y;

        document.write("Sum is: " + sum+"<br>");
        document.write("Difference is: " + difference+"<br>");
        document.write("Product is : " + product);

    </script>
    
    <br><br>
    <h2>Area of a Rectangle</h2>
    <script>
        let length=6;
        let breadth=2;
        let area=length*breadth;
        
        document.write("Area of the <b>Rectangle</b> with length <b>" + length + "cm</b> and breadth <b>" + breadth + "cm </b>is:<b> " + area + "cm²</b>")
    </script>
    <h2>Redeclaration of variable</h2>
    <script>
        var a=20;
        document.write("Before redeclaration: "+a+"<br>");
        var a=30;
        document.write("After redeclaration: "+a+"<br>")
    </script>
    <h2>Square of a Number</h2>
    <script>
        let num=parseInt(prompt("Enter the number to square:  "));

        let square=num*num;
        document.write("Squared value is: "+square);
    </script>
    

</body>

</html>
