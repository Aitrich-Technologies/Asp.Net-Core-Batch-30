<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        

let num = parseInt(prompt("Enter a number:"));

if (num > 100) {
    document.write("The number is greater than 100");
} else if (num === 100) {
    document.write("The number is equal to 100");
} else {
    document.write("The number is less than 100");
}

    </script>
</body>
</html>
