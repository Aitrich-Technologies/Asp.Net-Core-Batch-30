<!DOCTYPE html>
<html>
<head>
  <title>Change Placeholder</title>
</head>
<body>
  <h2>Input Example</h2>
  <input type="text" id="myInput" placeholder="Enter your name">

  <button id="btn">Click to change placeholder</button>

  <script>

    const btn=document.getElementById("btn");
    const myInput=document.getElementById("myInput");

    btn.addEventListener("click",function(){
        myInput.setAttribute('placeholder','this is the updated placeholder');
    });
   
    
  </script>
</body>
</html>
