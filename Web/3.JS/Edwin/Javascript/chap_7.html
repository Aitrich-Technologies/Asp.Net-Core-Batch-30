function findMostExpensiveProduct(products) {
                let expensiveProductPrice = products[0].price;
                let expensiveProduct = products[0].name;

                for (let i = 0; i < products.length; i++) {
                    if (products[i].price > expensiveProductPrice) {
                        expensiveProductPrice = products[i].price;
                        expensiveProduct = products[i].name;
                    }
                }
                return "The expensive product in the cart is: " + expensiveProduct + " with a price of: " + expensiveProductPrice;
            }
