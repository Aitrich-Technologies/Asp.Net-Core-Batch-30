<!-- <!DOCTYPE html>
<html>
<head>
  <title>Toggle Highlight</title>
  <style>
    p {
      font-size: 18px;
    }
    .highlight {
      background-color: yellow;
      font-weight: bold;
      color: red;
    }
  </style>
</head>
<body>
  <h2>Example Page</h2>
  <p id="myPara">This is a paragraph that can be highlighted.</p>

  <button id="toggleBtn" onclick="toggleHighlight()">Highlight</button>

  <script>
    function toggleHighlight() {
      let para = document.getElementById("myPara");
      let btn = document.getElementById("toggleBtn");

    
      para.classList.toggle("highlight");

     
      if (para.classList.contains("highlight")) {
        btn.innerText = "Remove Highlight";
      } else {
        btn.innerText = "Highlight";
      }
    }
  </script>
</body>
</html>


 -->
