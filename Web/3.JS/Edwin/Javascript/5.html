<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
         let n = 10;  
    let k = 1, sum = 0;

    while (k <= n) {
        sum += k;
        k++;
    }

    document.write("Sum of numbers from 1 to " + n + " = " + sum);
    </script>
</body>
</html>
