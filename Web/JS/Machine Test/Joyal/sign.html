<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Newsletter signup</title>
</head>
<body>
    <form>
        Name: <input type="text" id="nameinp" placeholder="Enter your name"><br><br>
        <button onclick="signUp()">Sign Up</button>
        <p id="p1"></p>
    </form>
    <script>
        function signUp(){
        var n=document.getElementById("nameinp").value;
        if(n == ""){
            alert("Please enter your name");
        }
        else{
            alert(n+" thank you for entering your name");
            document.getElementById("p1").innerHTML="Thank you";
        }
        }
    </script>
</body>
</html>
