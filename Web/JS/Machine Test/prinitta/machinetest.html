<!DOCTYPE html>
<html>
<head>
</head>
<body>
    <button onclick="OnlineFoodOrder()">Order Food</button>

    <p id="messages"></p>

    <script>
        function OnlineFoodOrder()
         {
            
            let user = confirm(" Do you want to place the order? ");

            if (user) {
                document.getElementById("messages").innerText = " Order placed successfully ";
            } 
            else {
                document.getElementById("messages").innerText = " order cancelled ";
            }
        }
    </script>
</body>
</html>
