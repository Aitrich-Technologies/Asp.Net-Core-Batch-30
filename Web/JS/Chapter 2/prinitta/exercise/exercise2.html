<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HireMe Now</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      display: flex;
    }

    
    .sidebar {
      width: 220px;
      background-color: #1e88e5;
      color: white;
      height: 100vh;
      padding: 20px;
    }

    .sidebar h2 {
      text-align: center;
      margin-bottom: 30px;
    }

    .sidebar ul {
      list-style: none;
      padding: 0;
    }

    .sidebar ul li {
      margin: 20px 0;
      cursor: pointer;
    }

    .addnew {
      margin-top: 50px;
      text-align: center;
      font-size: 20px;
    }

    /* Main Content */
    .main {
      flex: 1;
      padding: 20px;
    }

    .header {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      margin-bottom: 20px;
    }

    .header img {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      margin: 0 10px;
    }

    .shortlist {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
    }

    .card {
      display: flex;
      align-items: center;
      gap: 15px;
      border: 1px solid #ddd;
      padding: 10px;
      border-radius: 8px;
    }

    .card img {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      object-fit: cover;
    }

    .card p {
      margin: 2px 0;
      font-size: 14px;
    }
  </style>
</head>
<body>
  
  <div class="sidebar">
    <h2>HireMe Now!</h2>
    <ul>
      <li><img src="images/dashboard 1.png"> Dash Board</li>
      <li><img src="images/suitcase 2.png">Jobs</li>
      <li><img src="images/application (1) 1.png"> Applications</li>
      <li><img src="images/notification-bing.png"> Interviews</li>
      <li><img src="images/message 1.png"> Messages</li>
      <li><img src="images/settings 1.png"> Settings</li>
    </ul>
    <div class="addnew"><img src="images/add-group (1) 1.png"> Add New</div>
  </div>

  
  <div class="main">
    
    <div class="header">
      <span>🔔</span>
      <img src="https://via.placeholder.com/40" alt="user">
      <span>⏻</span>
    </div>


    <h3>ShortList</h3>
    <div class="shortlist" id="shortlist"></div>
  </div>

  <script>
    
    const candidates = [
      { name: "Alen", qualification: "MCA", experience: "3 Years", location: "Bangalore",image: "images/m1.png"},
      {name: "Sarah",qualification: "MSC",experience: "2 Years",location: "Chennai",image: "images/m2.png"},
      {name: "Vivek",qualification: "BTech",experience: "5 Years",location: "Thiruvananthapuram",image: "images/girl.png"},
      { name: "Deepak Roy", qualification: "BTech", experience: "2 Years", location: "Calicut", image: "images/m1.png"},
    ];

    
    const shortlistContainer = document.getElementById("shortlist");

    candidates.forEach(c => {
      const card = document.createElement("div");
      card.classList.add("card");
      card.innerHTML = `
        <img src="${c.image}" alt="${c.name}">
        <div>
          <p><b>${c.name}</b></p>
          <p>Qualification: ${c.qualification}</p>
          <p>Experience: ${c.experience}</p>
          <p>Location: ${c.location}</p>
        </div>
      `;
      shortlistContainer.appendChild(card);
    });
  </script>
</body>
</html>
