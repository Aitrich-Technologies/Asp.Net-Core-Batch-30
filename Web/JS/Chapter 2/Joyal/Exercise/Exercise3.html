  <script>
    var applicantList = [
      { image: "images/m1.png", name:"Manu", jobrole:"Java Developer", phone:"3 year", email:"Banglore"},
      { image: "images/girl.png", name:"Lamiya", jobrole:"Marketing Executive", phone:"2 year", email:"Chennai"},
      { image: "images/m2.png", name:"Alexander", jobrole:"H R Manager", phone:"5 year", email:"Thiruvananthapuram"},
      { image: "images/m3.png", name:"Deepak Roy", jobrole:"System Analyst", phone:"2 year", email:"Calicut"},
    ];

    listApplicants();

    function listApplicants() {
      var contentDiv = document.getElementById('content');

      applicantList.forEach(function(applicant) {
        var cardDiv = document.createElement('div');
        cardDiv.className = "card";

        var image = document.createElement('img');
        image.src = applicant.image;

        var name = document.createElement('h3');
        name.textContent = applicant.name;

        var jobrole = document.createElement('p');
        jobrole.innerHTML = "<b>Job Role:</b> " + applicant.jobrole;

        var phone = document.createElement('p');
        phone.innerHTML = "<b>Phone:</b> " + applicant.phone;

        var email = document.createElement('p');
        email.innerHTML = "<b>Email:</b> " + applicant.email;

        cardDiv.appendChild(image);
        cardDiv.appendChild(name);
        cardDiv.appendChild(jobrole);
        cardDiv.appendChild(phone);
        cardDiv.appendChild(email);

        contentDiv.appendChild(cardDiv);
      });
    }


  </script>
