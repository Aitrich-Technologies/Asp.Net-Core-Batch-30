     <form onsubmit="return validateForm()" style="margin-left: 80px;">
     <label class="lab1" style="font-weight: bolder;">Full Name</label><br>
     <br>
     <input type="text" name="name" id="name" class="inp1" placeholder="" style="height: 30px; border-radius: 5px; width: 400px; background-color: rgb(219, 224, 224); border: 0px;">
     <br><br>
     <label class="lab2" style="font-weight: bolder;">UserName</label><br>
     <br>

     <br><br>
     <label class="lab3"  type="email" style="font-weight: bolder;">Email Address</label><br>
     <br>
     <input type="text" class="inp3" placeholder="" name="email" id="email" style="height: 30px; border-radius: 5px; width: 400px; background-color: rgb(219, 224, 224); border: 0px;">
     <br><br>
     <label class="lab4" style="font-weight: bolder;">Phone Number</label><br>
     <br>
     <input type="tel" name="text" id="phone" class="inp4" placeholder="" style="height: 30px; border-radius: 5px; width: 400px; background-color: rgb(219, 224, 224); border: 0px;">
     <p id="error" style="color: red; margin-left: 100px;"></p>
     </form>

<!-- Popup Box -->
<div id="popup" style="display:none; 
    position: fixed; 
    top: 30%; 
    left: 40%; 
    transform: translate(-20%, -20%);
    width: 300px; 
    background: white; 
    border: 1px solid #ccc; 
    padding: 15px; 
    box-shadow: 0 4px 10px rgba(0,0,0,0.3); 
    border-radius: 8px; 
    font-family: Arial, sans-serif;">

  <h3>Entered Details are:</h3>
  <p><b>Name:</b> <span id="outName"></span></p>
  <p><b>UserName:</b> <span id="outUser"></span></p>
  <p><b>Email:</b> <span id="outEmail"></span></p>
  <p><b>Phone:</b> <span id="outPhone"></span></p>
  
  <button onclick="closePopup()" style="margin-top: 10px; padding: 5px 10px; border: none; background: #333; color: #fff; border-radius: 5px; cursor: pointer;">
    Close
  </button>
</div>
<button type="button" onclick="showDetails()"
