<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Js Activity 2 form</title>
</head>
<body>
    <form id="newform" onsubmit="return validation()">
        Username: <input type="text" id="usern"><br><br>
        Email: <input type="text" id="email"><br><br>
        Age: <input type="number" id="age"><br><br>
        Phone number: <input type="text" id="pn"><br><br>
        <button type="submit">Submit</button>
    </form>
    <p id="error" style="color: red;"></p>

    <script>
        function validation(){
            var u = document.getElementById("usern").value.trim();
            var email = document.getElementById("email").value.trim();
            var a = document.getElementById("age").value.trim();
            var p = document.getElementById("pn").value.trim();
            var errorMsg = document.getElementById("error");

            errorMsg.innerText = ""; // reset

            // Username check
            var alphareg = /^[A-Za-z]+$/;
            if(u === ""){
                errorMsg.innerText = "Username is required";
                return false;
            } else if(!alphareg.test(u)){
                errorMsg.innerText = "Username must contain only letters (A–Z or a–z)";
                return false;
            }

            // Email check
            var ereg = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if(!ereg.test(email)){
                errorMsg.innerText = "Enter a valid email address";
                return false;
            }

            // Age check
            if(a === "" || isNaN(a) || a < 18){
                errorMsg.innerText = "Age must be a number and 18 or older";
                return false;
            }

            // Phone check
            var preg = /^[0-9]{10}$/;
            if(!preg.test(p)){
                errorMsg.innerText = "Phone number must be exactly 10 digits";
                return false;
            }

            return true; // all good
        }
    </script>
</body>
</html>
