<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Js activity 1</title>
    <style>
        .content{
            font-size: 20px;
            margin-left: 5%;
        }
    </style>
</head>
<body>
    <div id="content" class="content">

    </div>
    <script>
        var fruit=[{name:"apple ",color:"red",image:"images/apples.jpg"},
                   {name:"grapes ",color:"Purple",image:"images/grapes.jpg"},
                   {name:"Orange ",color:"Orange",image:"images/orange.jpg"}
                  ];
                  fruitList();
                  function fruitList(){
                    var cont=document.getElementById("content");
                    for(var i in fruit){
                        var contentdiv=document.createElement('p');

                        var image=document.createElement('img');
                        image.src=fruit[i].image;

                        var name=document.createElement('n');
                        name.textContent=fruit[i].name;

                        var color=document.createElement('c');
                        color.textContent=fruit[i].color;

                        contentdiv.appendChild(image);
                        contentdiv.appendChild(name);
                        contentdiv.appendChild(color);
                        content.appendChild(contentdiv);
                    }
                  }
    </script>
</body>
</html>
