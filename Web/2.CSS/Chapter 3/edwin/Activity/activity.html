<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

<style>
.rotate{
    width: 100px;
    height: 100px;
    background-color: red;
    transform: rotate(45deg);
    position: relative;
    top: 50px;
    left: 50px;

}
.scale:hover{
    width: 100px;
    height: 100px;
    transform: scale(2,2);
   
}
.btn{
    width: 100px;
    height: 50px;
    background-color: blue;
    transform: skew(20deg, 20deg);
}
.box{
    width: 100px;
    height: 100px;
    background-color: green;
   
    
}
.box:hover{
    transform: translate(100px, 50px);
    transition: 1s;
}
.d{
width: 100px;
height: 100px;
background-color: rgb(21, 149, 55);

}
.d:hover{
    transform:rotateX(180deg);
    transition: 1s;
    }
    .color{
    width: 100px;
    height: 100px;  
    background-color: tomato;
    
    }
    .color:hover{
    background-color: yellow;   
    transition: 1s;
    }
.bwh{
    width: 100px;
    height: 100px;
    background-color: rgb(169, 42, 42);
}
.bwh:hover{
    width: 200px;
    height: 200px;
    background-color: rgb(169,42, 42);
}
.border{
    width: 100px;
    height: 100px;
    border-radius: 5px;
    border: 5px solid black;
    
}
.border:hover{
    border-radius: 5px;
    transition: 1s;
    border: 5px solid red;
}

.opacity{
    width: 100px;
    height: 100px;
    background-color: rgb(131, 22, 22);
   
}
.opacity:hover{
    opacity: 0.5;
    transition: 1s;
}
.op{
    font-size: 20px;
    background-color: rgb(169, 42, 42);
    transition: 0.5;
}
.op:hover{
    
    background-color: rgb(16, 152, 91);
    font-size: 25px;
}
</style>
</head>
<body>
    <div class="rotate">

    </div><br><br><br><br><br><br><br>
    <img src="img/London_Dest_16531610X.jpeg"  width="200px" height="200px"    class="scale"><br><br><br><br>
    <button class="btn">skew btn</button><br><br><br><br>
    <div class="box"></div><br><br><br><br>
    <div class="d"> vishnu</div><br><br><br><br>
    <button class="color"> Hi</button><br><br><br><br>
    <div class="bwh"></div>
    <br><br><br><br>
    <div class="border"></div> <br><br><br><br>
    <div class="opacity"></div>
    <br><br><br><br>
    <button class="op">CM</button>
    
</body>
</html>
