<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - Job Portal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  body {
    font-family: 'Poppins', sans-serif;
    background: #1f4aa1; /* background blue */
    min-height: 100vh;
  }

  .login-wrapper {
    background: #ffffff; /* white card */
    border-radius: 12px;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
    margin-top: 100px;
  }

  .login-wrapper h2 {
    text-align: center;
    color: #1f6feb; /* primary blue */
    font-weight: 600;
    margin-bottom: 10px;
  }

  .login-wrapper p {
    text-align: center;
    color: #6c757d; /* muted gray text */
    margin-bottom: 30px;
  }

  .form-control {
    border-radius: 10px;
    padding: 10px 15px;
  }

  .btn-login {
    background: #1f6feb; /* button blue */
    color: white;
    border-radius: 10px;
    padding: 10px;
    width: 100%;
    border: none;
    transition: 0.3s;
  }

  .btn-login:hover {
    background: #155bcf; /* darker blue on hover */
  }

  .form-check-label {
    color: #6c757d; /* muted gray */
  }

  .forgot-link {
    text-decoration: none;
    color: #1f6feb; /* blue link */
    font-size: 14px;
  }

  .forgot-link:hover {
    text-decoration: underline;
  }

  .brand {
    text-align: center;
    font-size: 18px;
    font-weight: 500;
    color: #6c757d; /* muted gray */
  }

  .brand span {
    color: #1f6feb; /* highlight blue */
    font-weight: 600;
  }
</style>

</head>
<body>

  <div class="container-fluid h-100">
    <div class="row h-100 justify-content-center align-items-center">
      <div class="col-xl-4 col-lg-5 col-md-6 col-sm-8 col-11">
        <div class="login-wrapper p-4 p-md-5">
          <h2>Admin Login</h2>
          <p>Welcome back! Please enter your credentials.</p>

          <form>
            <div class="mb-3">
              <label for="email" class="form-label">Email or Username</label>
              <input type="text" class="form-control" id="email" placeholder="admin@example.com" required>
            </div>

            <div class="mb-3">
              <label for="password" class="form-label">Password</label>
              <input type="password" class="form-control" id="password" placeholder="••••••••" required>
            </div>

            <div class="d-flex justify-content-between align-items-center mb-3">
              <div class="form-check">
                <input type="checkbox" class="form-check-input" id="remember">
                <label class="form-check-label" for="remember">Remember me</label>
              </div>
              <a href="#" class="forgot-link">Forgot Password?</a>
            </div>

            <button type="submit" class="btn-login">Login</button>
          </form>

          <div class="brand mt-4">© 2025 <span>JobPortal Admin</span></div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
