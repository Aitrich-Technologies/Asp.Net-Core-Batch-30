<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Job Portal</title>

 
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background: linear-gradient(135deg, #4B0082, #8A2BE2);
      color: white;
      font-family: 'Poppins', sans-serif;
    }

    .navbar {
      background-color: transparent !important;
    }

    .navbar a {
      color: white !important;
      margin: 0 10px;
      font-weight: 500;
    }

    .search-bar input {
      border-radius: 8px;
      border: none;
      padding: 10px;
      width: 100%;
    }

    .search-bar button {
      border-radius: 8px;
      background-color: #4B0082;
      color: white;
      border: none;
      padding: 10px 15px;
    }

    .job-card {
      background-color: rgba(255, 255, 255, 0.9);
      color: #333;
      border-radius: 10px;
      padding: 15px;
      margin-bottom: 15px;
      display: flex;
    }

    .job-card h5 {
      color: #4B0082;
    }

    .job-card .btn {
      border-radius: 6px;
      font-weight: 500;
    }

 
   .sidebar {
      padding: 15px;
      height: fit-content;
     margin-top: 90px;
    position: absolute;
    margin-left: 100px;
    width: 200px;
    
      
    }

    .sidebar a {
      display: block;
      color: white;
      margin-bottom: 10px;
      text-decoration: none;
      
    }

    .sidebar a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container py-4">
  
    <div class="d-flex justify-content-between align-items-center mb-4">
      <div>
        <h2><strong>Need A Job?</strong></h2>
        <p>Find the perfect job that you deserved</p>
      </div>
      <nav class="navbar">
        <a href="#">Home</a>
        <a href="#">About us</a>
        <a href="#">Contact us</a>
        <a href="#">Help & Support</a>
      </nav>
    </div>

    
    <div class="row">
      <div class="col-lg-8">
    
        <div class="search-bar d-flex gap-2 mb-4">
          <input type="text" placeholder="Enter the job title">
          <input type="text" placeholder="Enter company name">
          <button><i class="bi bi-search"></i> 🔍</button>
        </div>

        <h4>Popular Jobs</h4>

        <div class="job-card d-flex justify-content-between align-items-center">
          <div>
            <h5>Job 1 Title</h5>
            <p class="mb-0">Company Name</p>
            <small>Description</small>
          </div>
          <div>
            <button class="btn btn-outline-primary me-2">View Job</button>
            <button class="btn btn-primary">Save Job</button>
          </div>
        </div>

        <div class="job-card d-flex justify-content-between align-items-center">
          <div>
            <h5>Job 2 Title</h5>
            <p class="mb-0">Company Name</p>
            <small>Description</small>
          </div>
          <div>
            <button class="btn btn-outline-primary me-2">View Job</button>
            <button class="btn btn-primary">Save Job</button>
          </div>
        </div>

        <div class="job-card d-flex justify-content-between align-items-center">
          <div>
            <h5>Job 3 Title</h5>
            <p class="mb-0">Company Name</p>
            <small>Description</small>
          </div>
          <div>
            <button class="btn btn-outline-primary me-2">View Job</button>
            <button class="btn btn-primary">Save Job</button>
          </div>
        </div>
      </div>
      <div class="col-lg-4 col-md-6">
        <img src="image/nn-removebg-preview.png" alt="Job Search" class="job-image img-fluid shadow">
          <div class="col-lg-4">
        <div class="sidebar">
          <a href="#">View Profile</a>
          <a href="#">Notification</a>
          <a href="#">Applied Jobs</a>
          <a href="#">Chat</a>
          <a href="#">Settings</a>
        </div>
      </div>
      </div>
      </div>
    </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
