<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Job Portal - Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      height: 100vh;
      background: linear-gradient(135deg, #4B0082, #8A2BE2);
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .login-box {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      padding: 40px;
      border-radius: 15px;
      width: 350px;
      box-shadow: 0 0 20px rgba(0,0,0,0.3);
      color: white;
    }
    .login-box h2 {
      text-align: center;
      margin-bottom: 25px;
      font-weight: 700;
    }
    .form-control {
      border-radius: 10px;
    }
    .btn-login {
      background-color: white;
      color: #8A2BE2;
      border-radius: 10px;
    }
    .btn-login:hover {
      background-color: #8A2BE2;
    }
    .google-btn {
      background-color: white;
      color: black;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .google-btn img {
      width: 20px;
    }
    .small-text {
      text-align: center;
      margin-top: 15px;
    }
  </style>
</head>
<body>

  <div class="login-box">
    <h2>LOG IN</h2>
    <form>
      <div class="mb-3">
        <input type="text" class="form-control" placeholder="Email or Phone" required>
      </div>
      <div class="mb-2">
        <input type="password" class="form-control" placeholder="Password" id="password" required>
      </div>
      <div class="d-flex justify-content-between align-items-center mb-3">
        <div class="form-check">
          <input class="form-check-input" type="checkbox" id="showPassword" onclick="togglePassword()">
          <label class="form-check-label" for="showPassword">Show Password</label>
        </div>
        <a href="#" class="text-white text-decoration-none">Forgot Password?</a>
      </div>
      <button type="submit" class="btn btn-login w-100 mb-3">LOGIN</button>
      <div class="text-center mb-3">OR</div>
      <button type="button" class="btn google-btn w-100">
        <img src="https://www.svgrepo.com/show/355037/google.svg" alt="Google Logo">
        Google
      </button>
    </form>
    <div class="small-text">
      Create an Account? <a href="#" class="text-white text-decoration-none fw-bold">Sign up</a>
    </div>
  </div>

  <script>
    function togglePassword() {
      const password = document.getElementById("password");
      password.type = password.type === "password" ? "text" : "password";
    }
  </script>


  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
