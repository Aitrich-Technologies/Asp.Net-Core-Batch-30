<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuickBite - Featured Restaurants</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

  <div class="container mt-4">
    <h2 class="text-center mb-4">Featured Restaurants</h2>
    <div class="row">

      <div class="col-12 col-md-6 col-lg-3 mb-3">
        <div class="p-3 bg-warning text-center rounded shadow">
          <h5>Spice Villa</h5>
          <p>Authentic Indian Cuisine</p>
        </div>
      </div>

      <div class="col-12 col-md-6 col-lg-3 mb-3">
        <div class="p-3 bg-success text-white text-center rounded shadow">
          <h5>Green Leaf</h5>
          <p>Fresh & Healthy Salads</p>
        </div>
      </div>

      <div class="col-12 col-md-6 col-lg-3 mb-3">
        <div class="p-3 bg-info text-white text-center rounded shadow">
          <h5>Pizza Planet</h5>
          <p>Hot & Cheesy Pizzas</p>
        </div>
      </div>

      <div class="col-12 col-md-6 col-lg-3 mb-3">
        <div class="p-3 bg-danger text-white text-center rounded shadow">
          <h5>Burger Hub</h5>
          <p>Juicy Burgers & Fries</p>
        </div>
      </div>

    </div>
  </div>

</body>
</html>
