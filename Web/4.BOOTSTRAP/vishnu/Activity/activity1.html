<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bootstrap Card Example</title>
   <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body>
 
  <div class="container mt-5">
    <h2 class="text-center mb-4">Our Featured Cards</h2>
    <div class="row">

<div class="col-md-4 mb-3">
<div class="card" style="width: 18rem;">
  <img src="download.png" class="card-img-top" alt="Sample Image">
  <div class="card-body">
    <h5 class="card-title">Card Title</h5>
    <p class="card-text">This is a short description about the content inside this card.</p>
    <a href="#" class="btn btn-primary">Read More</a>
  </div>
</div>
</div>

      <div class="col-md-4 mb-3">
        <div class="card shadow">
          <div class="card-header text-bg-secondary">Featured</div>
          <img src="download.png" class="card-img-top" alt="Card 2">
          <div class="card-body">
            <h5 class="card-title">Card Title Two</h5>
            <p class="card-text">Includes header and footer sections.</p>
            <a href="#" class="btn btn-success">Explore</a>
          </div>
          <div class="card-footer text-muted text-center">Updated 2 days ago</div>
        </div>
      </div>

      <div class="col-md-4 mb-3">
        <div class="card text-bg-dark">
          <img src="download.png" class="card-img" alt="Overlay">
          <div class="card-img-overlay d-flex flex-column justify-content-end">
            <h5 class="card-title" style="color: black;">Overlay Card</h5>
            <p class="card-text"  style="color: black;">Text displayed over the image background.</p>
          </div>
        </div>
      </div>

      

<div id="carouselExampleIndicators" class="carousel slide carousel1">
  <div class="carousel-indicators">
    <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="0" class="active" aria-current="true" aria-label="Slide 1"></button>
    <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="1" aria-label="Slide 2"></button>
    <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="2" aria-label="Slide 3"></button>
  </div>
  <div class="carousel-inner">
    <div class="carousel-item active">
      <img src="images.jpg" class="d-block w-100" alt="...">
    </div>
    <div class="carousel-item">
      <img src="download.jpg" class="d-block w-100" alt="...">
    </div>
    <div class="carousel-item">
      <img src="images1.jpg" class="d-block w-100" alt="...">
    </div>
  </div>
  <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide="prev">
    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
    <span class="visually-hidden">Previous</span>
  </button>
  <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide="next">
    <span class="carousel-control-next-icon" aria-hidden="true"></span>
    <span class="visually-hidden">Next</span>
  </button>
</div>

      
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<style>
  .carousel1 {
    max-width: 600px;  
    margin: 30px auto; 
  }
</style>

</body>
</html>
